<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-POWER AUTO SERVICE | 3D Drive</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Підключення бібліотеки Three.js та завантажувача 3D-моделей (GLTF/GLB) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <header class="header">
        <div class="logo"><span>M-POWER</span> AUTO</div>
        <a href="#booking" class="btn-neon-sm">Записатись</a>
    </header>

    <section class="hero">
        <div class="hero-content">
            <span class="badge-neon">3D PREMIUM EXPERIENCE</span>
            <h1>ОБСЛУГОВУВАННЯ ТВОЄЇ МРІЇ</h1>
            <p>Діагностика, ремонт та чип-тюнінг авто будь-якої складності з гарантією якості.</p>
            <a href="#booking" class="btn-neon">Записатися на сервіс <i class="fa-solid fa-bolt"></i></a>
        </div>

        <!-- Контейнер для 3D полотна Three.js -->
        <div id="car-3d-container"></div>
    </section>

    <!-- Скрипт керування 3D машиною -->
    <script src="{{ url_for('static', filename='js/3d-car.js') }}"></script>
</body>
</html>
